<!DOCTYPE html>

<html lang="en">
    <head>
        <title>Tables and Forms</title>
    </head>

    <body>
        <h1>Pizza Ordering Form</h1>
        <form>
            <section>
                <h2>Contact Information</h2>

                <label for="inName">Name:</label>
                <input type="text" id="inName" name="inName" required> <br>

                <label for="inPhone">Phone:</label>
                <input type="tel" id="inPhone" name="inPhone" required> <br>
            
                <label for="inEmail">Email:</label>
                <input type="email" required> <br>

            </section>

            <section>
                <h2>Select Pizza Size</h2>
                
                <label>Select Size:</label>
                <select name="sizeIn" id="sizeIn" required>
                    <option value="">--Select Size--</option>
                    <option value="m">Medium</option>
                    <option value="l">Large</option>
                    <option value="xl">XLarge</option>
                </select>
            </section>

            <section>
                <h2>Select Sauce</h2>

                <input type="radio" name=""><label>Marinara</label><br>
                <input type="radio" name=""><label>Ranch</label><br>
                <input type="radio" name=""><label>No Sauce</label><br>
            </section>

            <section>
                <h2>Select Toppings</h2>

                <input type="checkbox" name=""><label>Pepperoni</label>
                <input type="checkbox" name=""><label>Sausage</label><br>
                <input type="checkbox" name=""><label>Mushrooms</label>
                <input type="checkbox" name=""><label>Onions</label><br>
                <input type="checkbox" name=""><label>Green Peppers</label>
                <input type="checkbox" name=""><label>Pineapple</label><br>
            </section>

            <section>
                <h2>Additional Instructions</h2>

                <textarea name="">Add instructions</textarea>
            </section>

            <input type="submit" value="Submit">
            <br>
            <br>
        </form>


        <section>
            <table>
                <caption>List of my favorite games</caption>

                <tbody>
                    <tr>
                        <th><b>Developer</b></th>
                        <th><b>Title</b></th>
                        <th><b>Year</b></th>
                    </tr>
                    <tr>
                        <td>Bandai Namco</td>
                        <td>Elden Ring</td>
                        <td>2023</td>
                    </tr>
                    <tr>
                        <td>Jarbit</td>
                        <td>Aberoth</td>
                        <td>2011</td>
                    </tr>
                    <tr>
                        <td>Studio Pixel</td>
                        <td>Cave Story</td>
                        <td>1998</td>
                    </tr>
                    <tr>
                        <td>Mp2 Games</td>
                        <td>Baba is You</td>
                        <td>2019</td>
                    </tr>
                </tbody>
                
            </table>
        </section>
        
    </body>

</html>
