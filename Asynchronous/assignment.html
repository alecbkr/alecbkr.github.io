<html lang="en">
    <head>
        <title>Build your team</title>
        <link rel="stylesheet" href="assignment.css">
        <script src = "teamup.js"></script>
    </head>

    <body>
        <form id="pokeform">
            <label>Name or ID</label>
            <input type="text" id="identity" name="identity" required>
            <button type="button" onclick="fetchPokemon()">Find</button> <br>
            <img id="sprite" src="default.png" width="200" height="200"> <br>

            <audio id="cryplayer" controls>
                <source id="crysource" type="audio/ogg">
                Audio player not supported in your browser
            </audio> 

            <div id="move_container">
                <select name="move1" id="move1"></select>
                <select name="move2" id="move2"></select>
                <select name="move3" id="move3"></select>
                <select name="move4" id="move4"></select>
            </div>

            <button type="button" id="addButton" onclick="addToTeam()">Add to Team</button>
        </form>

        <section id="team_list"></section>
    </body>

</html>
